services:
  app:
    build:
      context: .
      target: development
    command: sh -c "npm install && npm run dev"
    environment:
      NODE_ENV: development
    ports:
      - "${APP_PORT:-44100}:44100"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    init: true

volumes:
  node_modules:
